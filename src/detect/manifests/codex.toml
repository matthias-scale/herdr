id = "codex"
version = "2026.08.31.1001"
min_engine_version = 3
updated_at = "2026-08-31T00:00:00Z"

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { regex = ['\A> You are in [^\r\n]+(?:\r?\n|$)'] },
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
]

[[rules]]
# Codex renders terminal failures above a returned composer. These rules rank
# above idle (100) but below screen working (500), so a new working spinner
# clears a still-visible error without depending on OSC title updates.
id = "auth_failure"
state = "blocked"
priority = 490
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['^\s*›\s*$']
any = [
  { line_regex = ['^\s*■ Your access token could not be refreshed because your refresh token has expired\. Please log out and sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Your access token could not be refreshed because your refresh token was already used\. Please log out and sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Your access token could not be refreshed because your refresh token was revoked\. Please log out and sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Your access token could not be refreshed\. Please log out and sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Your access token could not be refreshed because you have since logged out or signed in to another account\. Please sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Quota exceeded\. Check your plan and billing details\.\s*$'] },
]

[[rules]]
id = "api_error"
state = "blocked"
priority = 490
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['^\s*›\s*$']
any = [
  { line_regex = ['^\s*■ request timed out\s*$'] },
  { line_regex = ['^\s*■ Connection failed: \S.*$'] },
  { line_regex = ['^\s*■ Error while reading the server response: \S.*$'] },
  { contains = ["■ We're currently experiencing high demand, which may cause temporary errors."] },
  { line_regex = ['^\s*⚠ Selected model is at capacity\. Please try a different model\.\s*$'] },
]

[[rules]]
# Plan usage exhausted: nobody can answer this, the agent resumes on its own
# when the window rolls. Ranks above the live blockers (900) and below the
# working rules (1050+) so a resumed agent clears it without latching.
id = "usage_limit_reached"
state = "blocked"
priority = 960
region = "bottom_non_empty_lines(8)"
visible_blocker = true
usage_limit = true
any = [
  { contains = ["hit your usage limit"] },
  { contains = ["usage limit reached"] },
  { contains = ["rate limit"], any = [
    { contains = ["try again at"] },
    { contains = ["try again later"] },
  ] },
]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent"
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "bottom_non_empty_lines(6)"
visible_working = true
# Anchoring to a block marker looked tidier but empties the region on a real
# turn: a codex 0.147 pane running a tool prints no bullet at all, so there is
# nothing to anchor to and the only working rule the manifest has stops firing.
# Six bottom lines clear the composer and status footer with room for a taller
# one, and codex erases this line when it streams, so scrollback holds no stale
# copy to match by accident.
line_regex = ['^(?:[•◦]\s+)?Working \([^)]*esc to interrupt\)(?: · .*)?$']
not = [{ contains = ["■ Conversation interrupted"] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
